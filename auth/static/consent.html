<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Godkend adgang · Kommune scraper</title>
  <style>
    :root { --bg:#fafafa; --fg:#18181b; --card:#fff; --muted:#71717a; --border:#e4e4e7; --danger:#b91c1c; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:1.25rem; background:var(--bg); color:var(--fg); }
    main { width:min(28rem,100%); padding:1.5rem; border:1px solid var(--border); border-radius:.75rem; background:var(--card); box-shadow:0 8px 28px rgb(0 0 0 / .06); }
    h1 { margin:0; font-size:1.25rem; letter-spacing:-.025em; }
    p { color:var(--muted); line-height:1.5; }
    code { color:var(--fg); }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; margin-top:1.25rem; }
    button { min-height:2.6rem; padding:.6rem .75rem; border:1px solid var(--border); border-radius:.5rem; background:var(--bg); color:var(--fg); font:inherit; cursor:pointer; font-weight:600; }
    button.primary { border-color:var(--fg); background:var(--fg); color:var(--bg); }
    button:disabled { opacity:.65; cursor:wait; }
    #error { min-height:1.2rem; margin:.8rem 0 0; color:var(--danger); font-size:.8rem; }
    @media (prefers-color-scheme:dark) { :root { --bg:#09090b; --fg:#fafafa; --card:#111113; --muted:#a1a1aa; --border:#27272a; --danger:#f87171; } }
  </style>
</head>
<body>
  <main>
    <h1>Godkend MCP-adgang</h1>
    <p><span id="client">En AI-klient</span> ønsker læseadgang til kommunale nyheder og pressemeddelelser.</p>
    <p>Adgangen kan kun bruges til søgning. MCP-serveren kan ikke ændre data.</p>
    <div class="actions">
      <button id="deny" type="button">Afvis</button>
      <button id="accept" class="primary" type="button">Godkend</button>
    </div>
    <div id="error" role="alert" aria-live="polite"></div>
  </main>
  <script>
    const query = new URLSearchParams(location.search);
    const clientId = query.get("client_id");
    const client = document.getElementById("client");
    const error = document.getElementById("error");
    const buttons = [document.getElementById("deny"), document.getElementById("accept")];

    if (clientId) {
      fetch(`/api/auth/oauth2/public-client?client_id=${encodeURIComponent(clientId)}`)
        .then((response) => response.ok ? response.json() : null)
        .then((payload) => { if (payload?.name) client.textContent = payload.name; })
        .catch(() => {});
    }

    async function decide(accept) {
      buttons.forEach((button) => { button.disabled = true; });
      error.textContent = "";
      try {
        const response = await fetch("/api/auth/oauth2/consent", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ accept, oauth_query: location.search.slice(1) }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || !payload.url) {
          error.textContent = payload.message || "Kunne ikke gemme dit valg";
          return;
        }
        location.assign(payload.url);
      } catch {
        error.textContent = "Kunne ikke kontakte serveren";
      } finally {
        buttons.forEach((button) => { button.disabled = false; });
      }
    }

    document.getElementById("accept").addEventListener("click", () => decide(true));
    document.getElementById("deny").addEventListener("click", () => decide(false));
  </script>
</body>
</html>
