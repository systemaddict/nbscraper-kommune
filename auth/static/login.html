<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Log ind · Kommune scraper</title>
  <style>
    :root { --bg:#fafafa; --fg:#18181b; --card:#fff; --muted:#71717a; --border:#e4e4e7; --danger:#b91c1c; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:1.25rem; background:var(--bg); color:var(--fg); }
    main { width:min(24rem,100%); padding:1.5rem; border:1px solid var(--border); border-radius:.75rem; background:var(--card); box-shadow:0 8px 28px rgb(0 0 0 / .06); }
    h1 { margin:0; font-size:1.25rem; letter-spacing:-.025em; }
    p { margin:.4rem 0 1.4rem; color:var(--muted); font-size:.85rem; }
    label { display:grid; gap:.4rem; margin-top:.9rem; font-size:.8rem; font-weight:600; }
    input,button { width:100%; min-height:2.6rem; padding:.6rem .75rem; border:1px solid var(--border); border-radius:.5rem; background:var(--bg); color:var(--fg); font:inherit; }
    input:focus,button:focus { outline:2px solid var(--muted); outline-offset:2px; }
    button { margin-top:1.1rem; cursor:pointer; border-color:var(--fg); background:var(--fg); color:var(--bg); font-weight:600; }
    button:disabled { opacity:.65; cursor:wait; }
    #error { min-height:1.2rem; margin:.8rem 0 0; color:var(--danger); font-size:.8rem; }
    .footnote { margin:1rem 0 0; text-align:center; font-size:.75rem; }
    @media (prefers-color-scheme:dark) { :root { --bg:#09090b; --fg:#fafafa; --card:#111113; --muted:#a1a1aa; --border:#27272a; --danger:#f87171; } }
  </style>
</head>
<body>
  <main>
    <h1>Kommune scraper</h1>
    <p>Log ind for at se driftsstatus og scrapede artikler.</p>
    <form id="login-form">
      <label>Email<input id="email" name="email" type="email" placeholder="navn@nbmedier.dk" autocomplete="username" required autofocus></label>
      <label>Adgangskode<input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required></label>
      <button id="submit" type="submit">Log ind</button>
      <div id="error" role="alert" aria-live="polite"></div>
    </form>
    <p class="footnote">Adgang oprettes af en administrator.</p>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const button = document.getElementById("submit");
    const error = document.getElementById("error");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = "Logger ind…";
      error.textContent = "";
      try {
        const response = await fetch("/api/auth/sign-in/email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: form.email.value, password: form.password.value, rememberMe: true }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          error.textContent = payload.message || "Email eller adgangskode er forkert";
          return;
        }
        const next = new URLSearchParams(location.search).get("next");
        location.assign(next?.startsWith("/") && !next.startsWith("//") ? next : "/");
      } catch {
        error.textContent = "Kunne ikke kontakte serveren";
      } finally {
        button.disabled = false;
        button.textContent = "Log ind";
      }
    });
  </script>
</body>
</html>
